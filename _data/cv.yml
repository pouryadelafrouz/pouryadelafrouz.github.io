    - 'Chen, M., Du, L., Zhao, S., Ye, B., Delafrouz, P., et al. (2026). ChromPolymerDB: a high-resolution database
      of single-cell 3D chromatin structures for functional genomics. Nucleic Acids Research 54(D1), D994–D1004.
      DOI: 10.1093/nar/gkaf1233'
    - 'Du, L., Farooq, H., Delafrouz, P., and Liang, J. (2025). Structural basis of differential gene expression
