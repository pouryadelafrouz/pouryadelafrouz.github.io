cv:
  name: Pourya Delafrouz
  label: Postdoctoral Researcher
  location: Philadelphia, PA
  summary: Postdoctoral researcher with a PhD in Bioinformatics and expertise in chromatin folding simulations,
    statistical analysis of biological experiments, topological data analysis, and high-performance computational
    modeling.
  sections:
    Education:
    - institution: University of Illinois Chicago
      area: Bioinformatics
      degree: PhD
      start_date: '2018'
      end_date: '2025'
      location: Chicago, IL
      highlights:
      - 'GPA: 3.96/4.0'
      - 'Thesis: Modeling Genome Organization in Eukaryotic and Prokaryotic Cells Using Specific Fold Interactions'
      - Defended September 30, 2025
    - institution: Sharif University of Technology
      area: Mechanical Engineering
      degree: MSc
      start_date: '2013'
      end_date: '2016'
      location: Tehran, Iran
      highlights:
      - 'GPA: 18.40/20'
    - institution: Shiraz University
      area: Mechanical Engineering
      degree: BSc
      start_date: '2009'
      end_date: '2013'
      location: Shiraz, Iran
      highlights:
      - 'GPA: 18.08/20'
      - Ranked second among more than 100 BSc students
    - institution: National Organization for Development of Exceptional Talents
      area: High School Diploma
      start_date: '2005'
      end_date: '2008'
      location: Shiraz, Iran
      highlights:
      - 'GPA: 18.76/20'
    Experience:
    - company: Fox Chase Cancer Center
      position: Postdoctoral Associate
      start_date: '2025'
      end_date: present
      location: Philadelphia, PA
      highlights:
      - Developed computational models of 3D genome organization using polymer simulations and Bayesian inference.
      - Implemented high-performance simulation and analysis pipelines in C++ and Python with GPU acceleration.
    - company: CCC Intelligent Solutions
      position: AI Enablement Intern
      start_date: 2022-06
      end_date: 2022-08
      location: Chicago, IL
      highlights:
      - Designed interactive tools for reporting resource usage.
      - Collected data from Kubernetes clusters, cloud billing, and GPU allocation/utilization to optimize resource
        management.
    Teaching Experience:
    - Teaching Assistant — Topological Data Analysis and Advanced Geometry, University of Illinois Chicago (Fall
      2020, 2021, 2022, 2023); designed assignments and computational problems using CGAL and GUDHI.
    - Teaching Assistant — Numerical Analysis, Sharif University of Technology (Fall 2015).
    - Teaching Assistant — Automatic Control, Shiraz University (Spring 2013).
    - Teaching Assistant — Thermodynamics, Shiraz University (Fall 2012 and Spring 2013).
    - Teaching Assistant — Statics, Shiraz University (Spring 2013).
    - Private Instructor — Physics Olympiad, Shiraz (2009–2012).
    Technical Skills:
    - 'Programming: C++ (CPU/GPU HPC), Python, R'
    - 'DevOps: Docker, Kubernetes, Minikube, Flask, Skaffold'
    - 'Mathematical software: MATLAB, Mathematica, Maple'
    - 'Visualization: VMD, PyMOL, Plotly, MATLAB, Simulink'
    - 'Molecular dynamics: LAMMPS, NAMD'
    - 'Engineering: Inventor, ANSYS'
    - 'Operating systems: Ubuntu, macOS, Windows'
    - 'Documentation: LaTeX, Microsoft Office'
    Research Interests:
    - 3D genome modeling and chromatin organization
    - Computational biology and bioinformatics
    - Statistical modeling and topological data analysis
    - High-performance computing and GPU acceleration
    - Machine learning for genomic data
    - Molecular dynamics and finite element modeling
    Research Projects:
    - '3D chromatin modeling: Simulated genome folding using GPU-accelerated Markov chain Monte Carlo in C++; generated
      heterogeneous single-cell conformations using less than 5% of Hi-C pairwise interactions and achieved over
      0.9 Pearson correlation with population Hi-C data.'
    - 'Molecular dynamics: Developed coarse-grained LAMMPS models for gold and silicon nanobeams with less than
      1% error and up to 10-fold faster computation; modeled fullerene migration on gold.'
    - 'Finite element modeling: Simulated cell migration and durotaxis; implemented FEM methods in MATLAB.'
    - 'Geometry and clustering: Developed CGAL mesh generation and chromosome territory analysis; used k-means,
      HDBSCAN, and persistent homology methods.'
    - 'Bioinformatics: Analyzed Hi-C, RNA-seq, seq-FISH, and histone modification data to investigate chromatin
      folding, gene expression, and genome organization.'
    Honors and Awards:
    - 2021, 2022, 2023 — Accepted talks, UIC Bioinformatics Research Day
    - 2013 — Merit-based admission to MSc programs at Sharif University of Technology, Shiraz University, and Tehran
      Polytechnic
    - 2009–2013 — Second in GPA among more than 100 BSc students, Shiraz University
    - 2009–2013 — Fellowship for gifted students, Shiraz University
    - 2005–2007 — Qualified for first national stage of Physics Olympiad
    Journal Publications:
