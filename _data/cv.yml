    - Delafrouz, P., Nesterova, T., Harris, F., Farooq, H., Du, L., Liu, J., Ma, A., Xiao, J., and Liang, J. (2026).
      Disentangling polymer confinement from specific-folding interactions reveals the drivers of E. coli chromosome
