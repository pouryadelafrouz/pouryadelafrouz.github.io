      - "Machine learning for genomic data"
      - "Molecular dynamics and finite element modeling"

Research Projects:
  - title: 3D Chromatin Modeling
    description:
      - "Simulated genome folding using GPU-accelerated Markov chain Monte Carlo in C++."
      - "Generated heterogeneous single-cell conformations using less than 5% of Hi-C pairwise interactions."
      - "Achieved over 0.9 Pearson correlation with population Hi-C data."

  - title: Molecular Dynamics
    description:
      - "Developed coarse-grained LAMMPS models for gold and silicon nanobeams."
      - "Achieved less than 1% error and up to 10-fold faster computation."
      - "Modeled fullerene migration on gold."

  - title: Finite Element Modeling
    description:
      - "Simulated cell migration and durotaxis."
      - "Implemented FEM methods in MATLAB."

  - title: Geometry and Clustering
    description:
      - "Developed CGAL mesh generation and chromosome territory analysis."
      - "Applied k-means, HDBSCAN, and persistent homology methods."

  - title: Bioinformatics
    description:
      - "Analyzed Hi-C, RNA-seq, seq-FISH, and histone modification data."
      - "Investigated chromatin folding, gene expression, and genome organization."

